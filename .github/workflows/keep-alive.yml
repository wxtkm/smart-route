name: SmartRoute Keep Alive

on:
  # Schedule is disabled to save GitHub Actions minutes and comply with usage policies.
  # An external monitoring service (e.g., UptimeRobot / cron-job.org) is used for pinging instead.
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          curl --fail --silent --show-error \
            --max-time 90 \
            https://smart-route-quo3.onrender.com/api/health
